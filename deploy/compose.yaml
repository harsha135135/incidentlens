# IncidentLens local infrastructure. Both services listen on loopback only.
#   postgres    IncidentLens's own database: jobs, evidence, reports and collected telemetry.
#               Durability stays on (fsync, synchronous commit).
#   prometheus  Scrapes the instrumented LedgerCore every 5 s and keeps 24 h of samples.
# Credentials come from deploy/local/ (generated by scripts/setup_local.py, ignored by Git).
# Start with: docker compose -f deploy/compose.yaml --env-file deploy/local/incidentlens.env up -d --wait
name: incidentlens

services:
  postgres:
    image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1  # 17.11
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    environment:
      POSTGRES_DB: incidentlens
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: ${INCIDENTLENS_DB_PASSWORD:?run scripts/setup_local.py first}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - incidentlens-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens -d incidentlens"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2  # v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:19090:9090"
    extra_hosts:
      # LedgerCore runs on the host's loopback; Docker Desktop resolves this name, Linux needs the mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./local/prometheus-scrape-password:/etc/prometheus/scrape-password:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  incidentlens-data:
  prometheus-data:
