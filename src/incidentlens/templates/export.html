<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>IncidentLens report {{ job.id }}</title>
<style>
body { font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; }
pre { white-space: pre-wrap; background: #f4f5f7; padding: .75rem; border-radius: 6px; font-size: 13px; }
.banner { padding: .75rem 1rem; border-radius: 6px; margin: 1rem 0; background: #eef3fb; }
.banner-stopped, .banner-missing { background: #fdf3e2; } .muted { color: #59626d; }
.coverage, .support, .assessment { font-size: 12px; padding: 0 .4rem; border-radius: 4px; background: #e9ecef; }
</style>
</head>
<body>
<h1>IncidentLens report</h1>
<p>“{{ job.symptom }}” · service {{ job.service_id }} · window {{ job.window_start[:19] }} to {{ job.window_end[:19] }} UTC</p>
{% include "report_body.html" %}
<p class="muted">Exported {{ exported_at }} UTC. This file contains no scripts and loads nothing from the network.</p>
</body>
</html>
