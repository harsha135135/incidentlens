<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · IncidentLens</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="/">IncidentLens</a>
    <span class="scope">LedgerCore (local)</span>
    {% block nav %}<button type="button" class="link" id="sign-out" hidden>Sign out</button>{% endblock %}
  </header>
  <main id="main" tabindex="-1">
    <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
